<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>EmonCMS Monitor</title>
<style>
:root{--bg:#09090b;--card:#121214;--bd:#27272a;--mut:#71717a;--w:#f59e0b;--k:#38bdf8;--e:#10b981;--txt:#f4f4f5}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,sans-serif}
.header{position:sticky;top:0;background:#0b0b0d;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--bd)}
.header b{font-size:16px}
.btn{background:#1c1c1f;border:1px solid var(--bd);color:var(--txt);padding:6px 14px;border-radius:18px;font-size:13px}
.wrap{padding:8px 8px 70px;max-width:480px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:11px 12px;margin-bottom:7px}
.row{display:flex;justify-content:space-between;align-items:baseline}
.top{margin-bottom:5px}
.lab{font-size:15px}
.val{font-weight:700;font-variant-numeric:tabular-nums}
.w{color:var(--w);font-size:20px}.e{color:var(--e);font-size:20px}.k{color:var(--k);font-size:15px;font-weight:600}
.u{font-size:11px;opacity:.7;margin-left:2px}
.m{color:var(--mut);font-size:13px}
.bot{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:0 8px;align-items:center;margin-top:3px}
.tri{display:flex;justify-content:space-between}
.tri>div{flex:1}.tri>div:nth-child(2){text-align:center}.tri>div:nth-child(3){text-align:right}
.foot{position:fixed;bottom:0;left:0;right:0;background:#0b0b0d;border-top:1px solid var(--bd);padding:7px 12px;font-size:11px;color:var(--mut);display:flex;justify-content:space-between}
</style>
</head>
<body>
<div class="header"><b>⚡ EmonCMS Monitor</b><button class="btn" id="r">Refresh</button></div>
<div class="wrap" id="l"></div>
<div class="foot"><span id="u">Connecting...</span><span id="c"></span></div>
<script>
const W="https://emon-proxy.new-life-786-786-786.workers.dev";
const F=[["499431","Water Tank"],["499374","Breaker"],["499383","AC Volts"],["499413","Breaker Today"],["499412","Breaker Total"],["499380","Solar"],["499381","Solar V"],["499388","Tot Load"],["499415","Solar Today"],["499414","Solar Total"],["499373","Fridge"],["541348","Fridge2"],["499411","Fridge Today"],["541350","Fridge2 Today"],["499367","Hair 1Ton"],["499409","Hair 1Ton Today"],["499408","Hair 1Ton Total"],["499364","Kenwood 1Ton"],["499407","Kenwood 1Ton Today"],["499406","Kenwood 1Ton Total"],["499362","Kenwood 1.5Ton"],["499405","Kenwood 1.5Ton Today"],["499404","Kenwood 1.5Ton Total"],["499403","Utility"],["499421","Utility Today"],["499420","Utility Total"],["499422","PC"],["499424","PC Today"],["499428","Temperature"],["499429","Humidity"]];
async function g(id){try{const r=await fetch(`${W}?id=${id}&_=${Date.now()}`,{cache:"no-store"});return parseFloat(await r.text())}catch{return null}}
const f=(v,d=1)=>v==null?"---":v.toFixed(d),i=v=>v==null?"---":Math.round(v);
async function render(){
 document.getElementById('r').textContent='↻';
 const d={};for(const [id,n] of F)d[n]=await g(id);
 let h='';
 h+=`<div class="card"><div class="row"><span class="lab">Water Tank</span><span><span class="val e">${f(d["Water Tank"],1)}</span><span class="u">%</span></span></div></div>`;
 h+=`<div class="card"><div class="row top"><div><span class="lab">Breaker</span> <span class="val w">${i(d["Breaker"])}</span></div><div><span class="lab">AC Input</span> <span class="val e">${i(d["AC Volts"])}</span><span class="u">v</span></div></div><div class="bot"><span class="m">Today</span><span class="k">${f(d["Breaker Today"],1)}</span><span class="m">Total</span><span class="k">${f(d["Breaker Total"],1)}</span></div></div>`;
 h+=`<div class="card"><div class="tri"><div><span class="lab">Solar</span> <span class="val w">${i(d["Solar"])}</span></div><div><span class="lab">Solar V</span> <span class="val e">${i(d["Solar V"])}</span></div><div><span class="lab">Tot Load</span> <span class="val w">${i(d["Tot Load"])}</span></div></div><div class="bot"><span class="m">Today</span><span class="k">${f(d["Solar Today"],1)}</span><span class="m">Total</span><span class="k">${f(d["Solar Total"],1)}</span></div></div>`;
 h+=`<div class="card"><div class="row top"><div><span class="lab">Fridge</span> <span class="val w">${i(d["Fridge"])}</span></div><div><span class="lab">Fridge2</span> <span class="val w">${i(d["Fridge2"])}</span></div></div><div class="bot"><span class="m">Today</span><span class="k">${f(d["Fridge Today"],1)}</span><span class="m">Today</span><span class="k">${f(d["Fridge2 Today"],1)}</span></div></div>`;
 h+=`<div class="card"><div class="row top"><span class="lab">Hair 1Ton</span><span><span class="val w">${i(d["Hair 1Ton"])}</span><span class="u">W</span></span></div><div class="bot"><span class="m">Today</span><span class="k">${f(d["Hair 1Ton Today"],1)}</span><span class="m">Total</span><span class="k">${f(d["Hair 1Ton Total"],1)}</span></div></div>`;
 h+=`<div class="card"><div class="row top"><span class="lab">Kenwood 1Ton</span><span><span class="val w">${i(d["Kenwood 1Ton"])}</span><span class="u">W</span></span></div><div class="bot"><span class="m">Today</span><span class="k">${f(d["Kenwood 1Ton Today"],1)}</span><span class="m">Total</span><span class="k">${f(d["Kenwood 1Ton Total"],1)}</span></div></div>`;
 h+=`<div class="card"><div class="row top"><span class="lab">Kenwood 1.5Ton</span><span><span class="val w">${i(d["Kenwood 1.5Ton"])}</span><span class="u">W</span></span></div><div class="bot"><span class="m">Today</span><span class="k">${f(d["Kenwood 1.5Ton Today"],1)}</span><span class="m">Total</span><span class="k">${f(d["Kenwood 1.5Ton Total"],1)}</span></div></div>`;
 h+=`<div class="card"><div class="row top"><span class="lab">Utility</span><span><span class="val w">${i(d["Utility"])}</span><span class="u">W</span></span></div><div class="bot"><span class="m">Today</span><span class="k">${f(d["Utility Today"],1)}</span><span class="m">Total</span><span class="k">${f(d["Utility Total"],1)}</span></div></div>`;
 h+=`<div class="card"><div class="row top"><span class="lab">PC</span><span><span class="val w">${i(d["PC"])}</span><span class="u">W</span></span></div><div class="bot"><span class="m">Today</span><span class="k">${f(d["PC Today"],1)}</span><span></span><span></span></div></div>`;
 h+=`<div class="card"><div class="row"><span class="m">Temperature</span><span><span class="val e">${f(d["Temperature"],1)}</span><span class="u">°C</span></span><span class="m" style="margin-left:18px">Humidity</span><span><span class="val e">${f(d["Humidity"],1)}</span><span class="u">%</span></span></div></div>`;
 document.getElementById('l').innerHTML=h;
 document.getElementById('u').textContent='Updated '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
 document.getElementById('r').textContent='Refresh';
}
let s=10,t;function cd(){clearInterval(t);s=30;document.getElementById('c').textContent=`Next in ${s}s`;t=setInterval(()=>{s--;document.getElementById('c').textContent=s>0?`Next in ${s}s`:'';if(s<=0){clearInterval(t);loop()}},1000)}
async function loop(){await render();cd()}
document.getElementById('r').onclick=loop;loop();
</script>
</body>
</html>
